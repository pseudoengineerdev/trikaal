name: trikaal_mobile
description: Mobile client for Trikaal Vedic astrology platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  share_plus: ^13.1.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/feature_cards/
  fonts:
    - family: Samarkan
      fonts:
        - asset: assets/fonts/SAMAN___.TTF
