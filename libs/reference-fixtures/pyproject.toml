[project]
name = "reference-fixtures"
version = "0.1.0"
description = "Golden reference fixture schema and comparison utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
