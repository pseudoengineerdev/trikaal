[project]
name = "vedic-engine"
version = "0.1.0"
description = "Deterministic Vedic astrology calculation engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyswisseph>=2.10.3.2,<3.0.0",
  "pyjhora>=4.8.0,<5.0.0",
  "geocoder>=1.38.1,<2.0.0",
  "geopy>=2.4.1,<3.0.0",
  "pytz>=2026.1,<2027.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "requests>=2.33.0,<3.0.0",
  "timezonefinder>=8.2.0,<9.0.0",
  "numpy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
