[project]
name = "vedic-engine"
version = "0.1.0"
description = "Deterministic Vedic astrology calculation engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyswisseph>=2.10.3.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
