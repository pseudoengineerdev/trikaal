[project]
name = "trikaal-api"
version = "0.1.0"
description = "Shared backend API for the Trikaal platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pyswisseph>=2.10.3.2,<3.0.0",
  "geonamescache>=3.0.1,<4.0.0",
  "httpx>=0.28.0,<1.0.0",
  "timezonefinder>=8.1.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
