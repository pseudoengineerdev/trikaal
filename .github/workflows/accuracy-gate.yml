name: Accuracy Gate

on:
  push:
  pull_request:

jobs:
  drik-parity-lock:
    name: Drik Parity Lock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "libs/reference-fixtures[dev]"
          python -m pip install -e "libs/vedic-engine[dev]"
          python -m pip install -e "services/api[dev]"

      - name: Validate fixture schemas
        run: python -m pytest libs/reference-fixtures/tests

      - name: Run parity tests
        run: python -m pytest services/api/tests/test_parity.py services/api/tests/test_parity_suite.py

      - name: Enforce strict 100% parity
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          api_src = root / "services" / "api" / "src"
          if str(api_src) not in sys.path:
              sys.path.insert(0, str(api_src))

          from trikaal_api.parity import run_drik_parity_suite_check

          result = run_drik_parity_suite_check()
          coverage = result.coverage
          coverage_line = (
              f"countries={coverage['country_count']}, "
              f"timezones={coverage['timezone_count']}, "
              f"years={coverage['min_birth_year']}-{coverage['max_birth_year']}, "
              f"dst_timezones={coverage['dst_observing_timezone_count']}"
          )
          print(
              f"Drik parity suite (verified-only): fixtures={result.fixture_count}, "
              f"accuracy={result.accuracy_percent}%"
          )
          print(f"Coverage summary: {coverage_line}")
          if "GITHUB_STEP_SUMMARY" in os.environ:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write("### Drik Accuracy Gate\n")
                  handle.write(f"- Verified fixtures: `{result.fixture_count}`\n")
                  handle.write(f"- Accuracy: `{result.accuracy_percent}%`\n")
                  handle.write(f"- Coverage: `{coverage_line}`\n")

          if result.fixture_count < 25:
              raise SystemExit(
                  "Accuracy gate failed: less than 25 verified Drik fixtures available."
              )
          if not result.all_matched:
              raise SystemExit(
                  f"Parity mismatch detected: {result.mismatched_fixture_count} fixture(s) failed."
              )
          if result.accuracy_percent != 100.0:
              raise SystemExit(f"Accuracy gate failed: {result.accuracy_percent}%")
          PY
